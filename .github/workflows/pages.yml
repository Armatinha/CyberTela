name: Publicar CyberTela no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente os arquivos públicos
        shell: bash
        run: |
          test -s index.html
          test -s sites-incriveis.css
          test -s sites-incriveis.js
          mkdir -p _site
          cp index.html sites-incriveis.css sites-incriveis.js LICENCA.md _site/
          touch _site/.nojekyll
      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
